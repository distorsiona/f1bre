<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>F1BRE</title>
  </head>
  <body>
    <p>Abriendo F1BRE... <a id="frontend-link" href="./frontend/">Abrir la web</a></p>
    <script>
      const target = new URL('./frontend/', window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      document.getElementById('frontend-link').href = target.href;
      window.location.replace(target.href);
    </script>
  </body>
</html>
